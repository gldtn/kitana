[package]
name = "kitana-bluetooth-pair"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"
